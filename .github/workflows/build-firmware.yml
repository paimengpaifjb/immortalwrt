name: ImmortalWrt-NN6000V2 云编译

on:
  workflow_dispatch: # 允许手动点击按钮触发

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 1. 检查出当前代码仓库
      uses: actions/checkout@v3

    - name: 2. 深度清理磁盘空间 (极其重要，防止编译空间不足)
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 3. 初始化编译环境 (安装依赖)
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools libpython3-dev qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "Asia/Shanghai"

    - name: 4. 克隆目标源码
      run: |
        git clone https://github.com/guorong697/ImmortalWrt-NN6000V2.git openwrt

    - name: 5. 更新并安装 Feeds (插件包)
      working-directory: ./openwrt
      run: |
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 6. 注入本地编译配置 (.config)
      run: |
        [ -e seed.config ] && mv seed.config openwrt/.config
        cd openwrt
        make defconfig

    - name: 7. 下载编译所需的依赖代码包
      working-directory: ./openwrt
      run: |
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 8. 正式开始编译固件
      working-directory: ./openwrt
      run: |
        echo -e "$(nproc) thread compile"
        # 默认多线程编译，如果失败则自动回退到单线程输出日志
        make -j$(nproc) || make -j1 || make -j1 V=s

    - name: 9. 提取并上传固件到 Artifacts
      uses: actions/upload-artifact@v3
      with:
        name: ImmortalWrt_NN6000V2_Firmware
        path: openwrt/bin/targets/*/*/*.bin
